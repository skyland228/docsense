<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — DocSense</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/api.js" defer></script>
    <script src="/static/js/register.js" defer></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="brand" href="/">DocSense</a>
        <p class="eyebrow">Новый аккаунт</p>
        <h1>Регистрация</h1>

        <form id="register-form" class="form-stack">
            <label>
                Имя пользователя
                <input name="username" autocomplete="username" required>
            </label>
            <label>
                Email
                <input name="email" type="email" autocomplete="email" required>
            </label>
            <label>
                Пароль
                <input name="plain_password" type="password" autocomplete="new-password" required>
            </label>
            <button type="submit">Создать аккаунт</button>
        </form>

        <p id="message" class="message" aria-live="polite"></p>
        <p class="auth-link">Уже есть аккаунт? <a href="/">Войти</a></p>
    </main>
</body>
</html>
