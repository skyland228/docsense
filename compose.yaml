
services:
  api:
    image: docsense:latest
    build:
      context: .
      dockerfile: dockerfile

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/docsense

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: docsense

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docsense"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
