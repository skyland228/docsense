services:
  api:
    image: docsense:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/docsense
    env_file:
      .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: docsense
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data:
